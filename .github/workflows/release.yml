name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Locate built jar
        id: jar
        run: |
          jar=$(ls build/libs/techutils-*.jar | grep -v -- '-sources' | head -1)
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          echo "Built: $jar"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Technical Utilities ${{ github.ref_name }}"
          files: ${{ steps.jar.outputs.path }}
          generate_release_notes: true
